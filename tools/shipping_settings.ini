# The presentation configuration an agent run must exercise.
#
# WHY THIS FILE EXISTS. psxport's `agent_environment` REFUSES to run without one, and the refusal is
# the point: an unset `PSXPORT_SETTINGS` hands the product back its own working-directory discovery,
# so the run's configuration would be whatever untracked file happens to sit beside the executable.
# A gate that passed in that state would be a gate on an unknown configuration. Measured on Spyro
# 2026-09-19: a whole body of green evidence, a 477-field oracle match included, was collected with
# the two features this project is about switched off, because the settings path pointed at a file
# that did not exist.
#
# AND WHY aspect IS 0 AND NOT 3. `3` is ASPECT_AUTO, and AUTO resolves to the SINK's aspect. An agent
# run is headless, so it has no wide sink and AUTO silently resolves to 4:3 — a run that printed
# `aspect=3 wide_engine=1` while capturing 4:3, which is why `picture_announce` says to read
# `render_width` and never that flag. An agent gate must name the aspect it is testing.
#
# CTR is a harness-first scaffold: it has no widescreen or interpolation implementation, so this file
# pins the retail 4:3 presentation rather than claiming an enhancement that does not exist. When CTR
# gains a wide plan, this becomes aspect=1 and the widening evidence starts here.
aspect=0
