# The 4:3 leg of the CTR widescreen pair, tracked so the run's configuration is a REPOSITORY fact.
#
# WHY A FILE PER LEG, not one file edited between runs. psxport's `agent_environment` refuses to
# launch without `PSXPORT_SETTINGS` precisely because an unset value hands the product its own
# working-directory discovery, so the run is configured by whichever untracked ini happens to sit
# beside the binary. Measured on Spyro 2026-09-19: a whole body of green evidence was collected with
# both features off, because the settings path pointed at a file that did not exist.
#
# `aspect=0` is the 4:3 presentation. It is NOT 3 (ASPECT_AUTO): AUTO resolves to the SINK's aspect,
# and an agent run is headless, so AUTO silently resolves to 4:3 while printing `aspect=3` and
# reading as though it were testing something else. Both legs name the aspect they test.
aspect=0
