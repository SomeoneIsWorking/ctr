# The 16:9 leg of the CTR widescreen pair, tracked so the run's configuration is a REPOSITORY fact.
#
# `aspect=1` requests the 16:9 presentation. Whether it HAPPENED is read from the product's own
# `render_width` versus `native_width`, never from this file: the knob records the REQUEST, and
# `picture_announce` says so in its own header because a request that did not happen reads exactly
# like a request that did.
#
# fps60 is deliberately absent, not set to 0. CTR declares no temporal interpolation product
# (`CtrRuntime::renderCapabilities` returns `temporalInterpolation = false`), so the key would be
# refused at load with a warning; leaving it out keeps the leg's configuration to the one variable
# under test.
aspect=1
